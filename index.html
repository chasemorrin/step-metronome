<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step Click — pattern metronome</title>
<link rel="icon" type="image/png" href="stepclickfavicon.png">
<link rel="apple-touch-icon" href="stepclickfavicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17140f;
    --panel: #211c15;
    --panel-edge: #2c261c;
    --amber: #ff9d1c;
    --amber-soft: #ffcf7a;
    --off: #2b271f;
    --off-border: #3c362a;
    --on-idle: #4a3c22;
    --on-border: #7a5c26;
    --text: #f2ead9;
    --text-dim: #9c9284;
    --stop: #d64545;
    --stop-soft: #ef7a6a;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #201a12 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
  }

  .device {
    width: 100%;
    max-width: 780px;
    background: linear-gradient(180deg, var(--panel) 0%, #1c1811 100%);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 28px 26px 24px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.03);
    position: relative;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .title-block { display: flex; flex-direction: column; gap: 2px; }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text);
  }

  h1 span { color: var(--amber); }

  .tagline {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .presets-wrap {
    position: relative;
  }

  #presetsBtn {
    background: #262019;
    border: 1px solid var(--panel-edge);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #presetsBtn:hover { color: var(--amber-soft); border-color: var(--on-border); }
  #presetsBtn .chip {
    font-size: 9px;
    background: var(--on-idle);
    color: var(--amber-soft);
    border-radius: 8px;
    padding: 1px 6px;
    min-width: 14px;
    text-align: center;
  }

  .presets-panel {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 280px;
    background: #1a160f;
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
    padding: 14px;
    z-index: 20;
  }
  .presets-panel.open { display: block; }

  .presets-panel .section-label {
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .save-row {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  #presetNameInput {
    flex: 1;
    background: #141009;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    padding: 7px 9px;
    outline: none;
    min-width: 0;
  }
  #presetNameInput:focus { border-color: var(--on-border); }
  #presetNameInput::placeholder { color: #5c5548; }

  #savePresetBtn {
    background: var(--on-idle);
    border: 1px solid var(--on-border);
    color: var(--amber-soft);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0 12px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  #savePresetBtn:hover { box-shadow: 0 0 10px rgba(255,157,28,0.25); }

  .preset-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 220px;
    overflow-y: auto;
  }

  .preset-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #201a12;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 7px 8px 7px 10px;
  }

  .preset-item .info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    cursor: pointer;
    flex: 1;
  }
  .preset-item .p-name {
    font-size: 11.5px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .preset-item .p-meta {
    font-size: 9.5px;
    color: var(--text-dim);
  }
  .preset-item:hover { border-color: var(--on-border); }

  .preset-del {
    background: transparent;
    border: none;
    color: #6e685c;
    font-size: 13px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
  }
  .preset-del:hover { color: var(--stop-soft); }

  .preset-empty {
    font-size: 10.5px;
    color: var(--text-dim);
    padding: 6px 2px;
  }

  .preset-status {
    font-size: 9.5px;
    color: var(--text-dim);
    margin-top: 8px;
    min-height: 12px;
  }

  .storage-divider {
    height: 1px;
    background: var(--panel-edge);
    margin: 12px 0 10px;
  }

  .storage-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }
  .storage-toggle:hover { color: var(--amber-soft); }
  .storage-toggle.connected #storageStatusLabel { color: var(--amber-soft); }
  .storage-caret { transition: transform 0.15s ease; font-size: 9px; }
  .storage-toggle.open .storage-caret { transform: rotate(180deg); }

  .storage-panel {
    display: none;
    margin-top: 10px;
    flex-direction: column;
    gap: 6px;
  }
  .storage-panel.open { display: flex; }

  .storage-copy {
    font-size: 10px;
    line-height: 1.5;
    color: var(--text-dim);
    margin: 0 0 4px;
  }
  .storage-copy a { color: var(--amber-soft); }

  .storage-label {
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .storage-label .optional { text-transform: none; letter-spacing: 0; opacity: 0.7; }

  #jsonbinKeyInput, #jsonbinBinInput {
    background: #141009;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 7px 9px;
    outline: none;
    width: 100%;
  }
  #jsonbinKeyInput:focus, #jsonbinBinInput:focus { border-color: var(--on-border); }

  .storage-checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    font-size: 10px;
    line-height: 1.4;
    color: var(--text-dim);
    cursor: pointer;
    margin: 2px 0 4px;
  }
  .storage-checkbox-row input { margin-top: 2px; accent-color: var(--amber); }
  .storage-checkbox-row strong { color: var(--text); }
  .storage-checkbox-row .optional { opacity: 0.75; }

  .storage-btn-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .storage-btn-row .ghost-btn { flex: 1; text-align: center; }
  #jsonbinDisconnectBtn { display: none; }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 14px;
    align-items: stretch;
    margin-bottom: 22px;
  }

  @media (max-width: 560px) {
    .controls { grid-template-columns: 1fr 1fr; }
    .transport { grid-column: 1 / -1; }
    .presets-panel { right: -10px; width: calc(100vw - 60px); max-width: 300px; }
  }

  .field {
    background: #1a160f;
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    padding: 10px 14px 12px;
  }

  .field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .tempo-readout {
    font-family: 'Oswald', sans-serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--amber-soft);
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }

  .tempo-readout .unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--off-border);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--amber);
    border: 2px solid #1a160f;
    box-shadow: 0 0 8px rgba(255,157,28,0.6);
    cursor: pointer;
    margin-top: -1px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--amber);
    border: 2px solid #1a160f;
    cursor: pointer;
  }

  .steps-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  input[type="number"] {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--amber-soft);
    font-family: 'Oswald', sans-serif;
    font-size: 30px;
    font-weight: 600;
    outline: none;
    font-variant-numeric: tabular-nums;
  }
  input[type="number"]::-webkit-inner-spin-button { opacity: 0.6; }

  .stepper-btn {
    background: #262019;
    border: 1px solid var(--panel-edge);
    color: var(--text-dim);
    width: 26px; height: 26px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }
  .stepper-btn:hover { color: var(--amber-soft); border-color: var(--on-border); }
  .stepper-btn:active { transform: translateY(1px); }

  .transport {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #playBtn {
    width: 100%;
    min-width: 96px;
    height: 100%;
    min-height: 62px;
    border-radius: var(--radius);
    border: 1px solid var(--on-border);
    background: linear-gradient(180deg, #3a2f19 0%, #2a2213 100%);
    color: var(--amber-soft);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: box-shadow 0.15s ease, transform 0.05s ease;
  }
  #playBtn:hover { box-shadow: 0 0 18px rgba(255,157,28,0.25); }
  #playBtn:active { transform: translateY(1px); }
  #playBtn.playing {
    background: linear-gradient(180deg, #3f1c1c 0%, #2b1414 100%);
    border-color: #7a3030;
    color: var(--stop-soft);
  }
  #playBtn .icon { font-size: 13px; }

  .grid-wrap {
    background: #141009;
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
    gap: 7px;
  }

  .box {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    background: var(--off);
    border: 1px solid var(--off-border);
    cursor: pointer;
    transition: background 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
  }

  .box.active {
    background: var(--on-idle);
    border-color: var(--on-border);
  }

  .box .num {
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-size: 8px;
    color: rgba(255,255,255,0.18);
    font-family: 'JetBrains Mono', monospace;
    pointer-events: none;
  }
  .box.active .num { color: rgba(0,0,0,0.35); }

  .box.playhead {
    box-shadow: 0 0 0 2px var(--amber-soft) inset;
  }

  .box.flash {
    background: var(--amber);
    border-color: var(--amber);
    box-shadow: 0 0 16px 3px rgba(255,157,28,0.85);
  }

  .box.accent-flash {
    background: #fff3d6;
    border-color: #fff3d6;
    box-shadow: 0 0 20px 5px rgba(255,220,150,0.95);
  }

  @media (prefers-reduced-motion: reduce) {
    .box { transition: none; }
  }

  .box:focus-visible {
    outline: 2px solid var(--amber-soft);
    outline-offset: 2px;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .hint {
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .quick-actions {
    display: flex;
    gap: 8px;
  }

  .ghost-btn {
    background: transparent;
    border: 1px solid var(--panel-edge);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .ghost-btn:hover { color: var(--amber-soft); border-color: var(--on-border); }
</style>
</head>
<body>

<div class="device">
  <header>
    <div class="title-block">
      <h1>Step<span>Click</span></h1>
      <div class="tagline">pattern-based metronome</div>
    </div>

    <div class="presets-wrap">
      <button id="presetsBtn">Presets <span class="chip" id="presetCount">0</span></button>
      <div class="presets-panel" id="presetsPanel">
        <div class="section-label">Save current pattern</div>
        <div class="save-row">
          <input type="text" id="presetNameInput" placeholder="Name this pattern…" maxlength="40">
          <button id="savePresetBtn">Save</button>
        </div>
        <div class="section-label">Saved patterns</div>
        <div class="preset-list" id="presetList"></div>
        <div class="preset-status" id="presetStatus"></div>

        <div class="storage-divider"></div>
        <div class="storage-toggle" id="storageToggle">
          <span id="storageStatusLabel">⚬ Not connected to JSONBin</span>
          <span class="storage-caret" id="storageCaret">▾</span>
        </div>
        <div class="storage-panel" id="storagePanel">
          <p class="storage-copy">Connect a free <a href="https://jsonbin.io" target="_blank" rel="noopener">JSONBin.io</a> account so patterns are saved permanently and travel with this file wherever it's opened.</p>
          <label class="storage-label" for="jsonbinKeyInput">API key</label>
          <input type="password" id="jsonbinKeyInput" placeholder="Master Key or Access Key">
          <label class="storage-checkbox-row">
            <input type="checkbox" id="jsonbinAccessKeyToggle">
            <span>This is a scoped <strong>Access Key</strong>, not the Master Key <span class="optional">(recommended if hosting publicly)</span></span>
          </label>
          <label class="storage-label" for="jsonbinBinInput">Bin ID <span class="optional">(leave blank to create one)</span></label>
          <input type="text" id="jsonbinBinInput" placeholder="Auto-created on connect">
          <div class="storage-btn-row">
            <button class="ghost-btn" id="jsonbinConnectBtn">Connect</button>
            <button class="ghost-btn" id="jsonbinDisconnectBtn">Disconnect</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="field">
      <label for="tempoSlider">Tempo</label>
      <div class="tempo-readout"><span id="bpmValue">120</span><span class="unit">BPM</span></div>
      <input type="range" id="tempoSlider" min="20" max="500" value="120" step="1">
    </div>

    <div class="field">
      <label for="stepsInput">Boxes</label>
      <div class="steps-input-row">
        <input type="number" id="stepsInput" min="1" max="100" value="8">
        <button class="stepper-btn" id="stepsDown" aria-label="Decrease boxes">–</button>
        <button class="stepper-btn" id="stepsUp" aria-label="Increase boxes">+</button>
      </div>
    </div>

    <div class="transport">
      <button id="playBtn"><span class="icon">▶</span><span id="playLabel">Play</span></button>
    </div>
  </div>

  <div class="grid-wrap">
    <div id="grid"></div>
  </div>

  <footer>
    <div class="hint">Click a box to toggle it. Lit box = sound plays there.</div>
    <div class="quick-actions">
      <button class="ghost-btn" id="allOnBtn">All on</button>
      <button class="ghost-btn" id="allOffBtn">All off</button>
    </div>
  </footer>
</div>

<script>
(function(){
  const grid = document.getElementById('grid');
  const tempoSlider = document.getElementById('tempoSlider');
  const bpmValue = document.getElementById('bpmValue');
  const stepsInput = document.getElementById('stepsInput');
  const stepsUp = document.getElementById('stepsUp');
  const stepsDown = document.getElementById('stepsDown');
  const playBtn = document.getElementById('playBtn');
  const playLabel = document.getElementById('playLabel');
  const allOnBtn = document.getElementById('allOnBtn');
  const allOffBtn = document.getElementById('allOffBtn');

  const presetsBtn = document.getElementById('presetsBtn');
  const presetsPanel = document.getElementById('presetsPanel');
  const presetCount = document.getElementById('presetCount');
  const presetNameInput = document.getElementById('presetNameInput');
  const savePresetBtn = document.getElementById('savePresetBtn');
  const presetList = document.getElementById('presetList');
  const presetStatus = document.getElementById('presetStatus');

  const storageToggle = document.getElementById('storageToggle');
  const storageStatusLabel = document.getElementById('storageStatusLabel');
  const storagePanel = document.getElementById('storagePanel');
  const jsonbinKeyInput = document.getElementById('jsonbinKeyInput');
  const jsonbinAccessKeyToggle = document.getElementById('jsonbinAccessKeyToggle');
  const jsonbinBinInput = document.getElementById('jsonbinBinInput');
  const jsonbinConnectBtn = document.getElementById('jsonbinConnectBtn');
  const jsonbinDisconnectBtn = document.getElementById('jsonbinDisconnectBtn');

  let bpm = 120;
  let numSteps = 8;
  let steps = []; // array of booleans, active state per box
  let isPlaying = false;

  let audioCtx = null;
  let schedulerTimer = null;
  let currentStep = 0;
  let nextNoteTime = 0;
  const scheduleAheadTime = 0.12; // seconds
  const lookahead = 25; // ms
  let notesInQueue = []; // {step, time, isAccent}
  let rafId = null;

  const PRESETS_KEY = 'presets';
  const JSONBIN_CONFIG_KEY = 'jsonbin_config';

  // To permanently bake a JSONBin connection into your own copy of this file
  // (so it works with zero setup even outside this chat), fill these in:
  const JSONBIN_API_KEY = '$2a$10$9ARHKeTmrEkoMWrFmawP5.TYxZEDkEJEzFWYcL5..gpywc6eaU.Hq';
  const JSONBIN_BIN_ID = '6a81d591f5f4af5e291d3532';
  const JSONBIN_IS_ACCESS_KEY = false; // set true if JSONBIN_API_KEY above is a scoped Access Key

  let presets = {}; // name -> {bpm, numSteps, steps}
  let platformStorageAvailable = !!(window.storage && window.storage.get && window.storage.set);
  let jsonbin = { apiKey: JSONBIN_API_KEY, binId: JSONBIN_BIN_ID, isAccessKey: JSONBIN_IS_ACCESS_KEY };

  function buildGrid(explicitSteps){
    let base;
    if (explicitSteps){
      base = explicitSteps;
    } else {
      base = steps.slice();
    }
    steps = [];
    for (let i = 0; i < numSteps; i++){
      steps.push(i < base.length ? !!base[i] : true);
    }
    grid.innerHTML = '';
    for (let i = 0; i < numSteps; i++){
      const box = document.createElement('div');
      box.className = 'box' + (steps[i] ? ' active' : '');
      box.tabIndex = 0;
      box.setAttribute('role', 'button');
      box.setAttribute('aria-pressed', steps[i] ? 'true' : 'false');
      box.dataset.index = i;
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = i + 1;
      box.appendChild(num);
      box.addEventListener('click', () => toggleStep(i));
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleStep(i); }
      });
      grid.appendChild(box);
    }
  }

  function toggleStep(i){
    steps[i] = !steps[i];
    const box = grid.children[i];
    box.classList.toggle('active', steps[i]);
    box.setAttribute('aria-pressed', steps[i] ? 'true' : 'false');
  }

  function setAll(val){
    for (let i = 0; i < steps.length; i++){
      steps[i] = val;
      const box = grid.children[i];
      if (box){
        box.classList.toggle('active', val);
        box.setAttribute('aria-pressed', val ? 'true' : 'false');
      }
    }
  }

  allOnBtn.addEventListener('click', () => setAll(true));
  allOffBtn.addEventListener('click', () => setAll(false));

  tempoSlider.addEventListener('input', () => {
    bpm = parseInt(tempoSlider.value, 10);
    bpmValue.textContent = bpm;
  });

  function setBpm(v){
    bpm = Math.max(20, Math.min(500, Math.round(v)));
    tempoSlider.value = bpm;
    bpmValue.textContent = bpm;
  }

  function clampSteps(v){
    v = Math.round(v);
    if (isNaN(v)) v = 8;
    return Math.max(1, Math.min(100, v));
  }

  function applyStepsCount(v){
    numSteps = clampSteps(v);
    stepsInput.value = numSteps;
    buildGrid();
    if (isPlaying) currentStep = currentStep % numSteps;
  }

  stepsInput.addEventListener('change', () => applyStepsCount(stepsInput.value));
  stepsUp.addEventListener('click', () => applyStepsCount(numSteps + 1));
  stepsDown.addEventListener('click', () => applyStepsCount(numSteps - 1));

  function ensureAudio(){
    if (!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }

  function scheduleClick(time, isAccent){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(isAccent ? 1300 : 950, time);
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(isAccent ? 0.9 : 0.6, time + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.06);
  }

  function nextNote(){
    const secondsPerBeat = 60.0 / bpm;
    nextNoteTime += secondsPerBeat;
    currentStep = (currentStep + 1) % numSteps;
  }

  function scheduler(){
    while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime){
      const isAccent = currentStep === 0;
      if (steps[currentStep]){
        scheduleClick(nextNoteTime, isAccent);
      }
      notesInQueue.push({ step: currentStep, time: nextNoteTime, isAccent, sounded: steps[currentStep] });
      nextNote();
    }
  }

  let lastPlayheadStep = -1;

  function drawLoop(){
    if (!isPlaying) return;
    const currentTime = audioCtx.currentTime;
    let latest = null;
    while (notesInQueue.length && notesInQueue[0].time <= currentTime){
      latest = notesInQueue.shift();
    }
    if (latest !== null && latest.step !== lastPlayheadStep){
      Array.from(grid.children).forEach(b => b.classList.remove('playhead'));
      const box = grid.children[latest.step];
      if (box){
        box.classList.add('playhead');
        if (latest.sounded){
          box.classList.add(latest.isAccent ? 'accent-flash' : 'flash');
          setTimeout(() => {
            box.classList.remove('flash', 'accent-flash');
          }, 90);
        }
      }
      lastPlayheadStep = latest.step;
    }
    rafId = requestAnimationFrame(drawLoop);
  }

  function start(){
    if (isPlaying) return;
    ensureAudio();
    isPlaying = true;
    currentStep = 0;
    notesInQueue = [];
    lastPlayheadStep = -1;
    nextNoteTime = audioCtx.currentTime + 0.05;
    schedulerTimer = setInterval(scheduler, lookahead);
    rafId = requestAnimationFrame(drawLoop);
    playBtn.classList.add('playing');
    playLabel.textContent = 'Stop';
    playBtn.querySelector('.icon').textContent = '■';
    requestWakeLock();
  }

  function stop(){
    isPlaying = false;
    clearInterval(schedulerTimer);
    schedulerTimer = null;
    cancelAnimationFrame(rafId);
    Array.from(grid.children).forEach(b => b.classList.remove('playhead', 'flash', 'accent-flash'));
    playBtn.classList.remove('playing');
    playLabel.textContent = 'Play';
    playBtn.querySelector('.icon').textContent = '▶';
    releaseWakeLock();
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) stop(); else start();
  });

  // ---------- Screen wake lock ----------
  // Keeps the screen on while playing so iOS doesn't dim/lock and pause playback.
  let wakeLock = null;
  const wakeLockSupported = 'wakeLock' in navigator;

  async function requestWakeLock(){
    if (!wakeLockSupported) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e){
      wakeLock = null; // permission denied, low battery mode, etc — playback continues regardless
    }
  }

  function releaseWakeLock(){
    if (wakeLock){
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  // Wake lock is auto-released by the browser when the tab is backgrounded;
  // re-acquire it when the user comes back if we're still playing.
  document.addEventListener('visibilitychange', () => {
    if (isPlaying && document.visibilityState === 'visible' && !wakeLock){
      requestWakeLock();
    }
  });

  // ---------- Presets ----------

  function setStatus(msg, isError){
    presetStatus.textContent = msg || '';
    presetStatus.style.color = isError ? 'var(--stop-soft)' : 'var(--text-dim)';
    if (msg){
      setTimeout(() => { if (presetStatus.textContent === msg) presetStatus.textContent = ''; }, 2600);
    }
  }

  function jsonbinHeaderName(){
    return jsonbin.isAccessKey ? 'X-Access-Key' : 'X-Master-Key';
  }

  function jsonbinReady(){
    return !!(jsonbin.apiKey && jsonbin.binId);
  }

  function updateStorageUI(){
    if (jsonbinReady()){
      storageToggle.classList.add('connected');
      storageStatusLabel.textContent = '● Connected to JSONBin';
      jsonbinDisconnectBtn.style.display = 'block';
      jsonbinKeyInput.value = jsonbin.apiKey;
      jsonbinBinInput.value = jsonbin.binId;
      jsonbinAccessKeyToggle.checked = !!jsonbin.isAccessKey;
    } else {
      storageToggle.classList.remove('connected');
      storageStatusLabel.textContent = '⚬ Not connected to JSONBin';
      jsonbinDisconnectBtn.style.display = 'none';
    }
  }

  async function loadJsonbinConfig(){
    if (jsonbin.apiKey && jsonbin.binId) return; // hardcoded in file, skip
    if (!platformStorageAvailable) return;
    try {
      const result = await window.storage.get(JSONBIN_CONFIG_KEY, false);
      if (result && result.value){
        const cfg = JSON.parse(result.value);
        if (cfg.apiKey && cfg.binId){
          jsonbin.apiKey = cfg.apiKey;
          jsonbin.binId = cfg.binId;
        }
      }
    } catch (e){ /* no saved config yet */ }
  }

  async function saveJsonbinConfig(){
    if (!platformStorageAvailable) return;
    try {
      await window.storage.set(JSONBIN_CONFIG_KEY, JSON.stringify(jsonbin), false);
    } catch (e){ /* best effort */ }
  }

  async function jsonbinFetchPresets(){
    const res = await fetch('https://api.jsonbin.io/v3/b/' + jsonbin.binId + '/latest', {
      method: 'GET',
      headers: { [jsonbinHeaderName()]: jsonbin.apiKey }
    });
    if (!res.ok) throw new Error('JSONBin read failed: ' + res.status);
    const data = await res.json();
    return (data && data.record) ? data.record : {};
  }

  async function jsonbinPutPresets(data){
    const res = await fetch('https://api.jsonbin.io/v3/b/' + jsonbin.binId, {
      method: 'PUT',
      headers: { [jsonbinHeaderName()]: jsonbin.apiKey, 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error('JSONBin write failed: ' + res.status);
  }

  async function jsonbinCreateBin(data){
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: {
        [jsonbinHeaderName()]: jsonbin.apiKey,
        'Content-Type': 'application/json',
        'X-Bin-Name': 'stepclick-presets'
      },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error('JSONBin create failed: ' + res.status);
    const result = await res.json();
    return result.metadata.id;
  }

  async function loadPresetsFromStorage(){
    if (jsonbinReady()){
      try {
        presets = await jsonbinFetchPresets();
        renderPresetList();
        updateStorageUI();
        return;
      } catch (e){
        setStatus('Could not reach JSONBin — showing local copy.', true);
      }
    }
    if (platformStorageAvailable){
      try {
        const result = await window.storage.get(PRESETS_KEY, false);
        presets = result && result.value ? JSON.parse(result.value) : {};
      } catch (e){
        presets = {};
      }
    }
    renderPresetList();
    updateStorageUI();
  }

  async function persistPresets(){
    if (jsonbinReady()){
      try {
        await jsonbinPutPresets(presets);
        return true;
      } catch (e){
        setStatus('JSONBin sync failed — check your connection.', true);
        return false;
      }
    }
    if (!platformStorageAvailable) return true;
    try {
      const result = await window.storage.set(PRESETS_KEY, JSON.stringify(presets), false);
      return !!result;
    } catch (e){
      return false;
    }
  }

  storageToggle.addEventListener('click', () => {
    storageToggle.classList.toggle('open');
    storagePanel.classList.toggle('open');
  });

  jsonbinConnectBtn.addEventListener('click', async () => {
    const apiKey = jsonbinKeyInput.value.trim();
    let binId = jsonbinBinInput.value.trim();
    if (!apiKey){
      setStatus('Paste your JSONBin master key first.', true);
      return;
    }
    jsonbinConnectBtn.textContent = 'Connecting…';
    jsonbinConnectBtn.disabled = true;
    try {
      jsonbin.apiKey = apiKey;
      jsonbin.isAccessKey = jsonbinAccessKeyToggle.checked;
      if (!binId){
        binId = await jsonbinCreateBin(presets);
        jsonbinBinInput.value = binId;
      }
      jsonbin.binId = binId;
      // verify read access
      presets = await jsonbinFetchPresets();
      await saveJsonbinConfig();
      renderPresetList();
      updateStorageUI();
      setStatus('Connected. Your patterns now save to JSONBin.', false);
    } catch (e){
      jsonbin = { apiKey: '', binId: '', isAccessKey: false };
      setStatus('Could not connect — check your key and bin ID.', true);
      updateStorageUI();
    }
    jsonbinConnectBtn.textContent = 'Connect';
    jsonbinConnectBtn.disabled = false;
  });

  jsonbinDisconnectBtn.addEventListener('click', async () => {
    jsonbin = { apiKey: '', binId: '', isAccessKey: false };
    jsonbinKeyInput.value = '';
    jsonbinBinInput.value = '';
    jsonbinAccessKeyToggle.checked = false;
    await saveJsonbinConfig();
    updateStorageUI();
    await loadPresetsFromStorage();
    setStatus('Disconnected from JSONBin.', false);
  });

  function renderPresetList(){
    const names = Object.keys(presets).sort((a, b) => a.localeCompare(b));
    presetCount.textContent = names.length;
    presetList.innerHTML = '';
    if (names.length === 0){
      const empty = document.createElement('div');
      empty.className = 'preset-empty';
      empty.textContent = 'No saved patterns yet.';
      presetList.appendChild(empty);
      return;
    }
    names.forEach(name => {
      const p = presets[name];
      const item = document.createElement('div');
      item.className = 'preset-item';

      const info = document.createElement('div');
      info.className = 'info';
      const nameEl = document.createElement('div');
      nameEl.className = 'p-name';
      nameEl.textContent = name;
      const metaEl = document.createElement('div');
      metaEl.className = 'p-meta';
      metaEl.textContent = p.bpm + ' BPM · ' + p.numSteps + ' boxes';
      info.appendChild(nameEl);
      info.appendChild(metaEl);
      info.addEventListener('click', () => applyPreset(name));

      const delBtn = document.createElement('button');
      delBtn.className = 'preset-del';
      delBtn.innerHTML = '&times;';
      delBtn.setAttribute('aria-label', 'Delete preset ' + name);
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deletePreset(name);
      });

      item.appendChild(info);
      item.appendChild(delBtn);
      presetList.appendChild(item);
    });
  }

  async function savePreset(){
    const name = presetNameInput.value.trim();
    if (!name){
      setStatus('Give your pattern a name first.', true);
      return;
    }
    presets[name] = { bpm: bpm, numSteps: numSteps, steps: steps.slice() };
    renderPresetList();
    presetNameInput.value = '';
    const ok = await persistPresets();
    setStatus(ok ? ('Saved "' + name + '".') : 'Saved for this session only.', !ok && (platformStorageAvailable || jsonbinReady()));
  }

  function applyPreset(name){
    const p = presets[name];
    if (!p) return;
    if (isPlaying) stop();
    setBpm(p.bpm);
    numSteps = clampSteps(p.numSteps);
    stepsInput.value = numSteps;
    buildGrid(p.steps);
    setStatus('Loaded "' + name + '".', false);
    presetsPanel.classList.remove('open');
  }

  async function deletePreset(name){
    delete presets[name];
    renderPresetList();
    const ok = await persistPresets();
    setStatus(ok ? ('Deleted "' + name + '".') : 'Deleted for this session only.', !ok && (platformStorageAvailable || jsonbinReady()));
  }

  savePresetBtn.addEventListener('click', savePreset);
  presetNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); savePreset(); }
  });

  presetsBtn.addEventListener('click', () => {
    presetsPanel.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!presetsPanel.contains(e.target) && e.target !== presetsBtn && !presetsBtn.contains(e.target)){
      presetsPanel.classList.remove('open');
    }
  });

  buildGrid();
  (async function init(){
    await loadJsonbinConfig();
    updateStorageUI();
    await loadPresetsFromStorage();
  })();
})();
</script>

</body>
</html>
